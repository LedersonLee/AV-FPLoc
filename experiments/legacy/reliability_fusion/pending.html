<h1>Reliability-aware weighted fusion · 진행 상태</h1><p>Node2 CPU-only 전처리 → checksum/좌표계 검증 → 고정 branch score → constant/adaptive weight 학습 → checkpoint 확정 → test3개 평가 → 여섯 방식 비교 HTML 순서입니다.</p><p>학습 train6 / val3. 기존 test3개는 학습·checkpoint 선택에 사용하지 않습니다. 아래 상태는 30초마다 갱신됩니다. 완료되면 결과 화면으로 자동 전환됩니다.</p><pre id="status">상태 확인 중…</pre>
<script>async function poll(){try{let r=await fetch('status.json?time='+Date.now());if(!r.ok)throw Error('Status '+r.status);let s=await r.json();document.getElementById('status').textContent=JSON.stringify(s,null,2);if(s.status==='complete')location.reload()}catch(e){document.getElementById('status').textContent=String(e)}}poll();setInterval(poll,30000)</script></html>
